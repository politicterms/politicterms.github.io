<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>gab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;
  --card:rgba(0,0,0,0.75);
  --border:rgba(255,255,255,0.10);
  --muted:#555555;
  --sub:#888888;
}
html,body{min-height:100vh;background:var(--bg);color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden}
#bg-gif{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.ov{position:fixed;inset:0;pointer-events:none}
.ov-dark{background:rgba(0,0,0,.58);z-index:1}
.ov-grid{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:42px 42px;z-index:2;opacity:.7}
.ov-radial{background:radial-gradient(600px at 50% 40%,rgba(255,255,255,.05),transparent 60%);z-index:3}
.ov-vig{background:linear-gradient(to bottom,rgba(0,0,0,.7) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.7) 100%);z-index:4}
.page{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.grid{width:100%;max-width:860px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{border-radius:22px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:20px;transition:border-color .2s}
.card:hover{border-color:rgba(255,255,255,.15)}
.span2{grid-column:span 2}
.ptop{display:flex;gap:12px;align-items:center}
.awrap{position:relative;width:54px;height:54px;flex-shrink:0}
.awrap img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid rgba(107,114,128,.25)}
.sdot{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;border:2px solid var(--bg);background:#6b7280;transition:background .4s}
.pname{font-size:1.1rem;font-weight:600}
.pstatus{font-size:.78rem;color:var(--muted);margin-top:2px}
.pbio{margin-top:12px;font-size:.82rem;color:var(--sub)}
hr{border:none;border-top:1px solid rgba(255,255,255,.08);margin:16px 0}
.lbl{font-size:.67rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.atext{font-size:.8rem;color:var(--muted);margin-top:8px}
.socials{display:flex;gap:8px;margin-top:16px}
.socials a{padding:8px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;text-decoration:none;color:#fff}
.socials a:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.socials svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ltc-head{display:flex;align-items:center;justify-content:space-between}
.ltc-ico{width:22px;height:22px;border-radius:50%;opacity:.85}
.ltc-price{font-size:1.45rem;font-weight:600;letter-spacing:-.02em;margin-top:12px}
.ltc-ch{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:.72rem}
.ltc-ch svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ltc-spark{margin-top:12px;width:100%}
.ltc-spark svg{width:100%;height:36px}
.proj{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);text-decoration:none;color:inherit;transition:opacity .15s}
.proj:last-child{border-bottom:none;padding-bottom:0}
.proj:first-child{padding-top:0}
.proj:hover{opacity:.65}
.pdot{width:7px;height:7px;border-radius:50%;background:#fff;flex-shrink:0;box-shadow:0 0 5px rgba(255,255,255,.4)}
.pname2{font-size:.83rem;font-weight:500}
.pdesc{font-size:.73rem;color:var(--muted);margin-top:1px}
.parr{margin-left:auto;color:var(--muted)}
.parr svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fcard{position:relative;overflow:hidden}
.orbs{position:absolute;inset:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(45px);opacity:.3}
.orb1{width:110px;height:110px;background:#fff;bottom:-30px;left:-20px}
.orb2{width:80px;height:80px;background:#aaa;bottom:0;right:-10px}
.finner{position:relative;z-index:1}
.fgrid{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.fitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.fawrap{position:relative}
.fawrap img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.15)}
.fdot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:#6b7280;transition:background .4s}
.fname{font-size:.73rem;color:var(--sub)}
.srow{display:flex;align-items:center;gap:10px;margin-top:10px}
.srow:first-of-type{margin-top:12px}
.sico{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sico svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sico img{width:16px;height:16px}
.sname{font-size:.8rem;font-weight:500;margin-bottom:3px}
.sbar{height:3px;width:100%;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.sfill{height:100%;background:linear-gradient(90deg,#fff,#aaa);border-radius:99px}
.smore{font-size:.7rem;color:#3f3f46;margin-top:10px}
.sp-song{font-size:.82rem;font-weight:500;color:#fff;margin-top:4px}
.sp-art{font-size:.74rem;color:var(--muted);margin-top:2px}
.sp-img{width:100%;border-radius:10px;margin-top:10px;object-fit:cover}
.online{background:#22c55e!important}
.idle{background:#f59e0b!important}
.dnd{background:#ef4444!important}
.offline{background:#6b7280!important}
@media(max-width:700px){
  .grid{grid-template-columns:1fr;gap:10px}
  .span2{grid-column:span 1}
}
</style>
</head>
<body>

<img id="bg-gif" src="https://38.media.tumblr.com/6eb96007c89d1638b88de4b4e7ceb27f/tumblr_nv3lo8vGr51ugh6wno1_500.gif" alt=""/>
<div class="ov ov-dark"></div>
<div class="ov ov-grid"></div>
<div class="ov ov-radial"></div>
<div class="ov ov-vig"></div>
<audio id="aud" loop><source src="https://files.catbox.moe/dtkvur.mp3" type="audio/mpeg"/></audio>

<div class="page">
<div class="grid">

  <div class="card">
    <div class="ptop">
      <div class="awrap">
        <img id="av" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="gab"/>
        <span class="sdot" id="sdot"></span>
      </div>
      <div>
        <div class="pname">gab</div>
        <div class="pstatus" id="stext">...</div>
      </div>
    </div>
    <p class="pbio">he/him</p>
    <hr/>
    <p class="lbl">Activity</p>
    <p class="atext" id="atext">Not doing anything</p>
    <div class="socials">
      <a href="https://www.instagram.com/whilenigga" target="_blank" rel="noopener" title="Instagram">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </a>
      <a href="https://discord.com/users/1421536263210795061" target="_blank" rel="noopener" title="Discord">
        <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z" stroke="none" fill="currentColor"/></svg>
      </a>
      <a href="https://github.com/politicterms" target="_blank" rel="noopener" title="GitHub">
        <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      </a>
    </div>
  </div>

  <div class="card">
    <div class="ltc-head">
      <p class="lbl">Litecoin</p>
      <img class="ltc-ico" src="https://assets.coingecko.com/coins/images/2/small/litecoin.png" alt="LTC"/>
    </div>
    <div class="ltc-price" id="ltc-price">$—</div>
    <div class="ltc-ch" id="ltc-ch">
      <svg viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
      <span>loading...</span>
    </div>
    <div class="ltc-spark">
      <svg viewBox="0 0 200 36" preserveAspectRatio="none" fill="none">
        <polyline id="spark" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none" points="0,18 200,18"/>
      </svg>
    </div>
  </div>

  <div class="card">
    <p class="lbl">Projects</p>
    <div style="margin-top:12px">
      <a class="proj" href="https://realkalii.github.io/ZetaPro-docs" target="_blank" rel="noopener">
        <div class="pdot"></div>
        <div>
          <div class="pname2">ZetaPro</div>
          <div class="pdesc">docs · w/ kali &amp; miel</div>
        </div>
        <span class="parr">
          <svg viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
        </span>
      </a>
    </div>
  </div>

  <div class="card span2 fcard">
    <div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
    <div class="finner">
      <p class="lbl">Friends</p>
      <div class="fgrid">
        <div class="fitem">
          <div class="fawrap">
            <img id="kav" src="https://cdn.discordapp.com/embed/avatars/1.png" alt="kali"/>
            <span class="fdot" id="kdot"></span>
          </div>
          <span class="fname">kali</span>
        </div>
        <div class="fitem">
          <div class="fawrap">
            <img id="mav" src="https://cdn.discordapp.com/embed/avatars/2.png" alt="miel"/>
            <span class="fdot" id="mdot"></span>
          </div>
          <span class="fname">miel</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="lbl">Skills</p>
    <div class="srow">
      <div class="sico">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </div>
      <div style="flex:1">
        <div class="sname">Design</div>
        <div class="sbar"><div class="sfill" style="width:80%"></div></div>
      </div>
    </div>
    <div class="srow">
      <div class="sico">
        <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/luau-dark.svg" style="filter:brightness(0) invert(1)" alt="Luau"/>
      </div>
      <div style="flex:1">
        <div class="sname">Luau</div>
        <div class="sbar"><div class="sfill" style="width:65%"></div></div>
      </div>
    </div>
    <div class="srow">
      <div class="sico">
        <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/lua.svg" alt="Lua"/>
      </div>
      <div style="flex:1">
        <div class="sname">Lua</div>
        <div class="sbar"><div class="sfill" style="width:60%"></div></div>
      </div>
    </div>
    <p class="smore">still learning more...</p>
  </div>

  <div class="card">
    <p class="lbl">Listening</p>
    <div id="sparea" style="margin-top:10px">
      <p class="atext">Nothing playing</p>
    </div>
  </div>

</div>
</div>

<script>
const SC = {online:'#22c55e',idle:'#f59e0b',dnd:'#ef4444',offline:'#6b7280'};
const SL = {online:'Online',idle:'Idle',dnd:'Do Not Disturb',offline:'Offline'};

function setStatus(dot, textEl, s) {
  dot.style.background = SC[s] || SC.offline;
  if (textEl) textEl.textContent = SL[s] || 'Offline';
}

async function lanyard(id) {
  try {
    const r = await fetch(`https://api.lanyard.rest/v1/users/${id}`);
    const j = await r.json();
    return j.success ? j.data : null;
  } catch { return null; }
}

function avatarUrl(uid, hash) {
  if (!hash) return 'https://cdn.discordapp.com/embed/avatars/0.png';
  return `https://cdn.discordapp.com/avatars/${uid}/${hash}.${hash.startsWith('a_') ? 'gif' : 'png'}?size=128`;
}

async function loadMe() {
  const d = await lanyard('1421536263210795061');
  if (!d) return;
  document.getElementById('av').src = avatarUrl(d.discord_user.id, d.discord_user.avatar);
  setStatus(document.getElementById('sdot'), document.getElementById('stext'), d.discord_status);
  const act = (d.activities || []).find(a => a.type === 0);
  document.getElementById('atext').textContent = act ? `Playing ${act.name}` : 'Not doing anything';
  if (d.spotify) {
    document.getElementById('sparea').innerHTML = `
      <div class="sp-song">${d.spotify.song}</div>
      <div class="sp-art">by ${d.spotify.artist}</div>
      ${d.spotify.album_art_url ? `<img class="sp-img" src="${d.spotify.album_art_url}" alt="album"/>` : ''}
    `;
  }
}

async function loadFriend(id, avId, dotId) {
  const d = await lanyard(id);
  if (!d) return;
  document.getElementById(avId).src = avatarUrl(d.discord_user.id, d.discord_user.avatar);
  setStatus(document.getElementById(dotId), null, d.discord_status);
}

async function loadLTC() {
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=litecoin&vs_currencies=usd&include_24hr_change=true');
    const j = await r.json();
    const price = j.litecoin.usd;
    const chg = j.litecoin.usd_24h_change;
    document.getElementById('ltc-price').textContent = `$${price.toFixed(2)}`;
    const up = chg >= 0;
    const clr = up ? '#ffffff' : '#888888';
    document.getElementById('ltc-ch').style.color = clr;
    document.getElementById('ltc-ch').innerHTML = `
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:${clr};fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
        ${up
          ? '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>'
          : '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>'}
      </svg>
      <span>${up ? '+' : ''}${chg.toFixed(2)}% today</span>`;

    const r2 = await fetch('https://api.coingecko.com/api/v3/coins/litecoin/market_chart?vs_currency=usd&days=7&interval=daily');
    const j2 = await r2.json();
    const pts = (j2.prices || []).map(p => p[1]);
    if (pts.length > 1) {
      const mn = Math.min(...pts), mx = Math.max(...pts), W = 200, H = 34;
      const coords = pts.map((v, i) => {
        const x = (i / (pts.length - 1)) * W;
        const y = H - ((v - mn) / (mx - mn || 1)) * H;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const sp = document.getElementById('spark');
      sp.setAttribute('points', coords);
      sp.style.stroke = up ? 'rgba(255,255,255,0.7)' : 'rgba(180,180,180,0.5)';
    }
  } catch(e) { console.warn('LTC failed', e); }
}

const aud = document.getElementById('aud');
aud.volume = 0.5;
aud.play().catch(() => {
  const tryPlay = () => {
    aud.play().catch(() => {});
    document.removeEventListener('click', tryPlay);
    document.removeEventListener('touchstart', tryPlay);
  };
  document.addEventListener('click', tryPlay);
  document.addEventListener('touchstart', tryPlay);
});

loadMe();
loadFriend('1424169884920578058', 'kav', 'kdot');
loadFriend('1534377484555124987', 'mav', 'mdot');
loadLTC();
setInterval(loadMe, 30000);
setInterval(loadLTC, 120000);
</script>
</body>
</html>
